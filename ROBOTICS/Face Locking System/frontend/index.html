<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Benax Technologies Ltd Tracking System</title>
    <style>
        :root {
            --bg: #f5f7f9;
            --surface: #ffffff;
            --line: #d9e1e8;
            --text: #1d2935;
            --muted: #6b7785;
            --accent: #1266f1;
            --ok: #15803d;
            --warn: #b45309;
            --danger: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 28px 32px 18px;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
            text-transform: lowercase;
        }

        main {
            width: min(1180px, calc(100% - 32px));
            margin: 24px auto;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(280px, 0.9fr);
            gap: 18px;
            align-items: stretch;
        }

        .camera-panel,
        .side-panel,
        .logs-panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .camera-panel {
            min-height: 440px;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            margin: 0;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
        }

        #face-container {
            flex: 1;
            min-height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101820;
            overflow: hidden;
        }

        #face-image {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #no-face-msg {
            color: #b6c2ce;
            font-size: 16px;
        }

        .side-panel {
            padding-bottom: 12px;
        }

        .status-list {
            padding: 4px 16px 0;
        }

        .status-row {
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
        }

        .status-row:last-child {
            border-bottom: 0;
        }

        .label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .value {
            font-size: 20px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .small-value {
            font-size: 15px;
            color: var(--text);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--line);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .connected {
            color: var(--ok);
            border-color: rgba(21, 128, 61, 0.35);
            background: rgba(21, 128, 61, 0.08);
        }

        .disconnected {
            color: var(--danger);
            border-color: rgba(185, 28, 28, 0.35);
            background: rgba(185, 28, 28, 0.08);
        }

        .locked {
            color: var(--ok);
        }

        .searching {
            color: var(--warn);
        }

        .logs-panel {
            margin-top: 18px;
        }

        #log-panel {
            min-height: 150px;
            max-height: 220px;
            overflow-y: auto;
            padding: 10px 16px 14px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            color: #435161;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #edf1f4;
        }

        @media (max-width: 820px) {
            header {
                padding: 22px 18px 16px;
            }

            h1 {
                font-size: 23px;
            }

            main {
                width: min(100% - 20px, 1180px);
                margin-top: 14px;
            }

            .workspace {
                grid-template-columns: 1fr;
            }

            .camera-panel {
                min-height: 320px;
            }

            #face-container {
                min-height: 260px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Benax Technologies Ltd Tracking System</h1>
        <div class="subtitle">iradukunda joeuse national examination</div>
    </header>

    <main>
        <div class="workspace">
            <section class="camera-panel">
                <h2 class="section-title">Locked Target Face</h2>
                <div id="face-container">
                    <img id="face-image" src="" alt="Locked target face preview">
                    <div id="no-face-msg">Waiting for locked target face...</div>
                </div>
            </section>

            <aside class="side-panel">
                <h2 class="section-title">Tracking Details</h2>
                <div class="status-list">
                    <div class="status-row">
                        <span class="label">Tracking Status</span>
                        <span id="movement-status" class="value">WAITING</span>
                    </div>
                    <div class="status-row">
                        <span class="label">Target</span>
                        <span id="target-info" class="small-value">--</span>
                    </div>
                    <div class="status-row">
                        <span class="label">Lock State</span>
                        <span id="lock-status" class="status-badge searching">SEARCHING</span>
                    </div>
                    <div class="status-row">
                        <span class="label">Confidence</span>
                        <span id="confidence" class="small-value">--</span>
                    </div>
                    <div class="status-row">
                        <span class="label">System Connection</span>
                        <span id="connection-status" class="status-badge disconnected">Disconnected</span>
                    </div>
                    <div class="status-row">
                        <span class="label">Last Update</span>
                        <span id="timestamp" class="small-value">--:--:--</span>
                    </div>
                </div>
            </aside>
        </div>

        <section class="logs-panel">
            <h2 class="section-title">Event Logs</h2>
            <div id="log-panel">
                <div id="logs"></div>
            </div>
        </section>
    </main>

    <script>
        const wsUrl = `ws://${window.location.hostname || 'localhost'}:9002`;
        let ws;

        const statusEl = document.getElementById('movement-status');
        const connEl = document.getElementById('connection-status');
        const timeEl = document.getElementById('timestamp');
        const confEl = document.getElementById('confidence');
        const logsEl = document.getElementById('logs');
        const targetEl = document.getElementById('target-info');
        const lockEl = document.getElementById('lock-status');
        const faceImageEl = document.getElementById('face-image');
        const noFaceMsgEl = document.getElementById('no-face-msg');

        function connect() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                connEl.textContent = 'CONNECTED';
                connEl.className = 'status-badge connected';
                addLog('System connected to backend.');
            };

            ws.onclose = () => {
                connEl.textContent = 'DISCONNECTED';
                connEl.className = 'status-badge disconnected';
                addLog('Connection lost. Reconnecting...');
                setTimeout(connect, 3000);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'STATUS') {
                        addLog(data.message);
                        return;
                    }
                    if (data.status) {
                        updateDashboard(data);
                    }
                } catch (e) {
                    console.log('Non-JSON message:', event.data);
                }
            };
        }

        function updateDashboard(data) {
            statusEl.textContent = data.status;

            if (data.target) {
                targetEl.textContent = data.target;
            }

            if (data.face_image) {
                faceImageEl.src = 'data:image/jpeg;base64,' + data.face_image;
                faceImageEl.style.display = 'block';
                noFaceMsgEl.style.display = 'none';
            } else if (!data.locked) {
                faceImageEl.style.display = 'none';
                noFaceMsgEl.style.display = 'block';
            }

            if (data.locked) {
                lockEl.textContent = 'LOCKED';
                lockEl.className = 'status-badge connected';
            } else {
                lockEl.textContent = 'SEARCHING';
                lockEl.className = 'status-badge searching';
            }

            if (data.status === 'MOVE_LEFT' || data.status === 'MOVE_RIGHT') {
                statusEl.style.color = 'var(--accent)';
            } else if (data.status === 'CENTERED') {
                statusEl.style.color = 'var(--ok)';
            } else {
                statusEl.style.color = 'var(--muted)';
            }

            if (data.confidence !== undefined) {
                confEl.textContent = `${(data.confidence * 100).toFixed(1)}%`;
            }

            timeEl.textContent = new Date().toLocaleTimeString();
        }

        function addLog(msg) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logsEl.insertBefore(entry, logsEl.firstChild);
        }

        connect();
    </script>
</body>

</html>
