openapi: 3.0.3
info:
  title: User Management Service API
  version: 1.0.0
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /users/me:
    get:
      summary: View own profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Own profile
    put:
      summary: Update own profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profile updated
  /users:
    get:
      summary: Admin list users
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User list
  /users/{id}:
    get:
      summary: Admin view user by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User profile
    put:
      summary: Admin update user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User updated
    delete:
      summary: Admin deactivate user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User deactivated
  /users/{id}/role:
    patch:
      summary: Admin change user role
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Role changed
  /users/{id}/status:
    patch:
      summary: Admin change user status
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Status changed
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
